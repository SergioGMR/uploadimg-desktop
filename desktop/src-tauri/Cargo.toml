[package]
name = "uploadimg-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
uploadimg-core = { path = "../crates/core" }
tauri = { version = "=2.11.2", default-features = false, features = ["wry", "compression"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
base64 = "=0.22.1"
getrandom = "=0.3.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
