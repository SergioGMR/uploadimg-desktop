[package]
name = "glib-backport-regression"
version = "0.0.0"
edition = "2021"

[dependencies]
glib = { version = "=0.18.5", path = "../../vendor/glib-0.18.5", default-features = false, features = ["default", "gio", "gio_ffi", "v2_58", "v2_60", "v2_62", "v2_64", "v2_66", "v2_68", "v2_70"] }
# Match the application feature unification on the optional GLib gio FFI.
gio-sys = { version = "=0.18.1", default-features = false, features = ["v2_58", "v2_60", "v2_62", "v2_64", "v2_66", "v2_68", "v2_70"] }

[workspace]

[profile.release]
opt-level = 3
debug = 1
